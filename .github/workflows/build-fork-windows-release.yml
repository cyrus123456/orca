name: Build fork Windows release

# Polls stablyai/orca's latest published release (stable or RC). When a new
# tag appears AND sync-upstream-main has already merged that version into fork
# main, build an UNSIGNED Windows installer and publish it as a fork release
# tagged v<version>-fork. Real-time triggers on another repo's release need a
# webhook on upstream we can't install, so we poll hourly. Unsigned because the
# fork has no SignPath/Apple certs — expect a Windows SmartScreen warning on
# first run.

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Force-build a specific upstream tag (e.g. v1.4.160 or v1.4.160-rc.3). Empty = latest published.
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-fork-windows-release
  cancel-in-progress: false

jobs:
  detect:
    # No-op on the original repo so this file is safe if it ever lands upstream.
    if: github.repository != 'stablyai/orca'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      build: ${{ steps.detect.outputs.build }}
      release_body: ${{ steps.detect.outputs.release_body }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Detect upstream release and decide whether to build
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${FORCE_TAG:-}" ]]; then
            tag="${FORCE_TAG}"
            release_body="$(gh api "repos/stablyai/orca/releases/tags/${FORCE_TAG}" --jq '.body // ""' 2>/dev/null || echo '')"
          else
            # GitHub returns releases newest-first by created_at. Pick the
            # latest published release whether stable or RC.
            tag="$(gh api 'repos/stablyai/orca/releases?per_page=20' \
              --jq '[.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$")))] | .[0].tag_name // empty')"
            release_body="$(gh api "repos/stablyai/orca/releases/tags/${tag}" --jq '.body // ""' 2>/dev/null || echo '')"
          fi
          echo "Upstream latest published: ${tag:-<none>}"
          # Build stable vX.Y.Z or RC vX.Y.Z-rc.N — both are published releases.
          if [[ -z "${tag:-}" || ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::notice::No published upstream release to build (${tag:-<none>})."
            echo "build=false" >>"$GITHUB_OUTPUT"
            echo "release_body=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          fork_tag="v${version}-fork"
          # Skip if the fork already built this version.
          if gh release view "$fork_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Fork release $fork_tag already exists; skipping."
            echo "build=false" >>"$GITHUB_OUTPUT"
            echo "release_body=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # fork main is already sync'd with upstream main (which may be at a
          # newer RC), so its package.json version won't match the stable tag.
          # build-windows forces the version below — no need to wait here.
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "build=true" >>"$GITHUB_OUTPUT"
          echo "Will build fork release $fork_tag mirroring upstream $tag."
          # Multiline output: use heredoc delimiter
          echo "release_body<<EOF" >>"$GITHUB_OUTPUT"
          echo "${release_body:-}" >>"$GITHUB_OUTPUT"
          echo "EOF" >>"$GITHUB_OUTPUT"

  build-windows:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set package.json version to upstream release
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "package.json version set to $VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build:release
        env:
          # Fork build is unofficial: leave identity empty so the telemetry
          # gate (IS_OFFICIAL_BUILD) short-circuits and no PostHog key is baked in.
          ORCA_BUILD_IDENTITY: ''

      - name: Build unsigned Windows installer
        shell: pwsh
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never

      - name: Create fork release and upload installer
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          RELEASE_BODY: ${{ needs.detect.outputs.release_body }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}-fork"
          notes="Unsigned Windows build of this fork, tracking upstream v${VERSION}. Built from fork main (includes fork-specific changes like custom agents). Not code-signed — Windows SmartScreen will warn on first run."
          if [[ -n "${RELEASE_BODY:-}" ]]; then
            notes="${notes}
          
          ---
          ## Upstream Release Notes
          
          ${RELEASE_BODY}"
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Orca fork v${VERSION} (unsigned Windows build)" \
            --notes "$notes" \
            dist/orca-windows-setup.exe
