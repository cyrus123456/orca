name: Sync upstream main

# Polls stablyai/orca (upstream) main and merges new commits into this fork's main.
# Fork main carries its own commits (features + this workflow), so we merge
# (not fast-forward) to preserve them. Real-time triggers on another repo's push
# require a webhook on upstream, which we can't install — so we poll instead.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    # Skip on the original repo so this file is a no-op if it ever lands upstream.
    if: github.repository != 'stablyai/orca'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          # GITHUB_TOKEN can't push changes that touch .github/workflows/* —
          # GitHub rejects it server-side regardless of the permissions block.
          # Use a PAT with `workflow` scope so upstream merges carrying workflow
          # file changes can push. Falls back to the default token when unset.
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          ref: main
          fetch-depth: 0

      - name: Configure git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/stablyai/orca.git

      - name: Fetch upstream main
        run: git fetch upstream main

      - name: Merge upstream/main into fork main
        id: merge
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          # -X ours auto-resolves content conflicts in favor of the fork's side,
          # so fork features survive while upstream's non-conflicting changes
          # still merge in. Only modify/delete conflicts (files upstream deleted
          # that the fork still carries) need the explicit handling below.
          if ! git merge --no-edit -X ours upstream/main; then
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "::error::Merge failed for an unexpected reason; aborting."
              exit 1
            fi
            echo "::warning::Merge left modify/delete conflicts; resolving them."
            for FILE in $(git diff --name-only --diff-filter=U); do
              # src/main/updater.test.ts: upstream replaced this monolithic test
              # with focused updater-*.test.ts files; the fork's copy only swaps
              # feed URLs against the old updater API — accept the deletion.
              # Every other file: keep the fork's version (-X ours policy).
              if [ "$FILE" = "src/main/updater.test.ts" ]; then
                git rm -f "$FILE"
              else
                git add "$FILE"
              fi
            done
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "::error::Unexpected unmerged paths remain."
              git merge --abort
              exit 1
            fi
            git commit --no-edit
          fi
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Already up to date with upstream/main."
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            echo "Merged upstream/main into fork main: $BEFORE -> $AFTER"
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to origin main
        if: steps.merge.outputs.synced == 'true'
        run: git push origin main
