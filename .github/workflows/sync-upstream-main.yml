name: Sync upstream main

# Polls stablyai/orca (upstream) main and merges new commits into this fork's main.
# Fork main carries its own commits (features + this workflow), so we merge
# (not fast-forward) to preserve them. Real-time triggers on another repo's push
# require a webhook on upstream, which we can't install — so we poll instead.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    # Skip on the original repo so this file is a no-op if it ever lands upstream.
    if: github.repository != 'stablyai/orca'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          # GITHUB_TOKEN can't push changes that touch .github/workflows/* —
          # GitHub rejects it server-side regardless of the permissions block.
          # Use a PAT with `workflow` scope so upstream merges carrying workflow
          # file changes can push. Falls back to the default token when unset.
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          ref: main
          fetch-depth: 0

      - name: Configure git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/stablyai/orca.git

      - name: Fetch upstream main
        run: git fetch upstream main

      - name: Merge upstream/main into fork main
        id: merge
        run: |
          set -euo pipefail
          BEFORE=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/main; then
            echo "::error::Merge from upstream/main failed (conflicts). Aborting to keep the tree clean. Resolve conflicts in a local clone, then re-run."
            git merge --abort
            exit 1
          fi
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "Already up to date with upstream/main."
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            echo "Merged upstream/main into fork main: $BEFORE -> $AFTER"
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to origin main
        if: steps.merge.outputs.synced == 'true'
        run: git push origin main
